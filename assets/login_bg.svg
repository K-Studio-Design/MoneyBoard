<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Illustrazione di sfondo per la schermata di accesso: le "card" dell'app (ciambella delle categorie,
       andamento mensile, saldo, calendario, carta) sparse e inclinate. Colori della palette dell'app. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#F0627E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- ciambella delle categorie -->
  <g transform="translate(120 120) rotate(-8)" filter="url(#soft)">
    <rect width="300" height="300" rx="34" fill="url(#glass)" stroke="#fff" stroke-opacity="0.35"/>
    <g transform="translate(150 150)" fill="none" stroke-width="30">
      <circle r="88" stroke="#ffffff" stroke-opacity="0.15"/>
      <circle r="88" stroke="#7C5CFC" stroke-dasharray="190 553" transform="rotate(-90)"/>
      <circle r="88" stroke="#F0627E" stroke-dasharray="130 553" stroke-dashoffset="-196" transform="rotate(-90)"/>
      <circle r="88" stroke="#14AE9E" stroke-dasharray="105 553" stroke-dashoffset="-332" transform="rotate(-90)"/>
      <circle r="88" stroke="#F5A524" stroke-dasharray="70 553" stroke-dashoffset="-443" transform="rotate(-90)"/>
      <circle r="88" stroke="#3B82F6" stroke-dasharray="30 553" stroke-dashoffset="-519" transform="rotate(-90)"/>
    </g>
    <rect x="110" y="140" width="80" height="10" rx="5" fill="#fff" fill-opacity="0.6"/>
    <rect x="125" y="158" width="50" height="8" rx="4" fill="#fff" fill-opacity="0.35"/>
  </g>

  <!-- andamento mensile: barre -->
  <g transform="translate(1110 90) rotate(6)" filter="url(#soft)">
    <rect width="380" height="250" rx="34" fill="url(#glass)" stroke="#fff" stroke-opacity="0.35"/>
    <rect x="30" y="28" width="150" height="12" rx="6" fill="#fff" fill-opacity="0.6"/>
    <g fill="#14AE9E">
      <rect x="40" y="130" width="18" height="80" rx="7"/><rect x="100" y="110" width="18" height="100" rx="7"/>
      <rect x="160" y="140" width="18" height="70" rx="7"/><rect x="220" y="90" width="18" height="120" rx="7"/>
      <rect x="280" y="120" width="18" height="90" rx="7"/>
    </g>
    <g fill="#F0627E">
      <rect x="62" y="150" width="18" height="60" rx="7"/><rect x="122" y="140" width="18" height="70" rx="7"/>
      <rect x="182" y="120" width="18" height="90" rx="7"/><rect x="242" y="150" width="18" height="60" rx="7"/>
      <rect x="302" y="135" width="18" height="75" rx="7"/>
    </g>
  </g>

  <!-- saldo: linea con area -->
  <g transform="translate(90 600) rotate(5)" filter="url(#soft)">
    <rect width="420" height="250" rx="34" fill="url(#glass)" stroke="#fff" stroke-opacity="0.35"/>
    <rect x="30" y="28" width="120" height="12" rx="6" fill="#fff" fill-opacity="0.6"/>
    <rect x="30" y="52" width="190" height="26" rx="10" fill="#fff" fill-opacity="0.85"/>
    <path d="M30 200 C 80 190, 110 150, 160 160 S 240 120, 280 130 S 350 80, 390 90 L390 225 L30 225 Z" fill="url(#area)"/>
    <path d="M30 200 C 80 190, 110 150, 160 160 S 240 120, 280 130 S 350 80, 390 90" fill="none" stroke="#fff"
          stroke-width="5" stroke-linecap="round"/>
    <circle cx="390" cy="90" r="9" fill="#fff"/>
  </g>

  <!-- calendario -->
  <g transform="translate(1180 560) rotate(-7)" filter="url(#soft)">
    <rect width="300" height="300" rx="34" fill="url(#glass)" stroke="#fff" stroke-opacity="0.35"/>
    <rect x="30" y="28" width="110" height="12" rx="6" fill="#fff" fill-opacity="0.6"/>
    <g fill="#fff">
      <rect x="30" y="70" width="30" height="30" rx="8" fill-opacity="0.18"/><rect x="66" y="70" width="30" height="30" rx="8" fill-opacity="0.45"/>
      <rect x="102" y="70" width="30" height="30" rx="8" fill-opacity="0.18"/><rect x="138" y="70" width="30" height="30" rx="8" fill-opacity="0.7"/>
      <rect x="174" y="70" width="30" height="30" rx="8" fill-opacity="0.25"/><rect x="210" y="70" width="30" height="30" rx="8" fill-opacity="0.18"/>
      <rect x="246" y="70" width="30" height="30" rx="8" fill-opacity="0.35"/>
      <rect x="30" y="106" width="30" height="30" rx="8" fill-opacity="0.3"/><rect x="66" y="106" width="30" height="30" rx="8" fill-opacity="0.18"/>
      <rect x="102" y="106" width="30" height="30" rx="8" fill-opacity="0.55"/><rect x="138" y="106" width="30" height="30" rx="8" fill-opacity="0.18"/>
      <rect x="174" y="106" width="30" height="30" rx="8" fill-opacity="0.4"/><rect x="210" y="106" width="30" height="30" rx="8" fill-opacity="0.2"/>
      <rect x="246" y="106" width="30" height="30" rx="8" fill-opacity="0.18"/>
      <rect x="30" y="142" width="30" height="30" rx="8" fill-opacity="0.18"/><rect x="66" y="142" width="30" height="30" rx="8" fill-opacity="0.6"/>
      <rect x="102" y="142" width="30" height="30" rx="8" fill-opacity="0.2"/><rect x="138" y="142" width="30" height="30" rx="8" fill-opacity="0.3"/>
      <rect x="174" y="142" width="30" height="30" rx="8" fill-opacity="0.18"/><rect x="210" y="142" width="30" height="30" rx="8" fill-opacity="0.5"/>
      <rect x="246" y="142" width="30" height="30" rx="8" fill-opacity="0.18"/>
      <rect x="30" y="178" width="30" height="30" rx="8" fill-opacity="0.4"/><rect x="66" y="178" width="30" height="30" rx="8" fill-opacity="0.18"/>
      <rect x="102" y="178" width="30" height="30" rx="8" fill-opacity="0.18"/><rect x="138" y="178" width="30" height="30" rx="8" fill-opacity="0.65"/>
      <rect x="174" y="178" width="30" height="30" rx="8" fill-opacity="0.25"/><rect x="210" y="178" width="30" height="30" rx="8" fill-opacity="0.18"/>
      <rect x="246" y="178" width="30" height="30" rx="8" fill-opacity="0.3"/>
    </g>
    <rect x="30" y="226" width="246" height="44" rx="12" fill="#fff" fill-opacity="0.15"/>
    <circle cx="52" cy="248" r="6" fill="#F5A524"/>
    <rect x="68" y="242" width="110" height="12" rx="6" fill="#fff" fill-opacity="0.55"/>
  </g>

  <!-- carta di pagamento -->
  <g transform="translate(600 760) rotate(-8)" filter="url(#soft)">
    <rect width="300" height="186" rx="26" fill="url(#card)" fill-opacity="0.85"/>
    <rect width="300" height="186" rx="26" fill="url(#glass)"/>
    <rect x="28" y="60" width="44" height="34" rx="8" fill="#F5A524" fill-opacity="0.9"/>
    <rect x="28" y="120" width="200" height="14" rx="7" fill="#fff" fill-opacity="0.7"/>
    <rect x="28" y="146" width="90" height="10" rx="5" fill="#fff" fill-opacity="0.45"/>
    <circle cx="240" cy="40" r="16" fill="#fff" fill-opacity="0.55"/><circle cx="262" cy="40" r="16" fill="#fff" fill-opacity="0.35"/>
  </g>

  <!-- monete -->
  <g filter="url(#soft)">
    <circle cx="1000" cy="905" r="46" fill="#F5A524" fill-opacity="0.85"/>
    <circle cx="1000" cy="905" r="32" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="5"/>
    <circle cx="1080" cy="855" r="30" fill="#14AE9E" fill-opacity="0.85"/>
    <circle cx="1080" cy="855" r="19" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="4"/>
    <circle cx="540" cy="940" r="22" fill="#7C5CFC" fill-opacity="0.8"/>
    <circle cx="470" cy="420" r="16" fill="#fff" fill-opacity="0.35"/>
    <circle cx="1060" cy="440" r="12" fill="#fff" fill-opacity="0.3"/>
  </g>
</svg>
